<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Museum of Minds</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;800&family=Newsreader:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#e9eef3;--card:#fff;--ink:#14203a;--mut:#52617d;--acc:#0b7f78;--gold:#a86a00;--line:#c3cddc;--ok:#1f7a3d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1424;--card:#172038;--ink:#e9eef7;--mut:#9fb0cc;--acc:#3fd0c0;--gold:#f2b84b;--line:#2a3757;--ok:#7fe0a0}}
:root[data-theme="dark"]{--bg:#0e1424;--card:#172038;--ink:#e9eef7;--mut:#9fb0cc;--acc:#3fd0c0;--gold:#f2b84b;--line:#2a3757;--ok:#7fe0a0}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.65 Newsreader,Georgia,serif}
header{padding:16px;text-align:center;border-bottom:1px solid var(--line)}
.brand{font:800 clamp(24px,6vw,40px) Syne,system-ui,sans-serif;letter-spacing:-.01em}
.brand i{color:var(--acc);font-style:normal}
#nav{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:10px;font-family:system-ui,sans-serif}
#nav a{padding:3px 10px;border:1px solid var(--line);color:var(--ink);text-decoration:none;font-size:14px}
#nav a.on{background:var(--acc);color:var(--bg);border-color:var(--acc)}#nav a.st::after{content:" ✓";color:var(--ok)}#nav a.on.st::after{color:var(--bg)}
main{max-width:820px;margin:0 auto;padding:22px 16px 60px}
h1,h2{font-family:Syne,system-ui,sans-serif;line-height:1.15;margin:.3em 0}h1{font-size:clamp(28px,6vw,44px)}
.plq{display:inline-block;border:1px solid var(--gold);color:var(--gold);padding:2px 10px;font:600 14px system-ui,sans-serif}
.cur{color:var(--mut);font-style:italic}
.exh{background:radial-gradient(ellipse at 50% 0,color-mix(in srgb,var(--gold) 22%,transparent),transparent 70%),var(--card);border:2px solid var(--ink);padding:14px;margin:22px 0;outline:1px solid var(--line);outline-offset:6px;font-family:system-ui,sans-serif;font-size:15px;line-height:1.5}
.lab{font:600 14px Syne,system-ui,sans-serif;color:var(--gold);margin-bottom:8px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.box,.quiz{background:var(--card);border-left:4px solid var(--acc);padding:10px 14px;margin:12px 0}
button,select{font:inherit;font-size:15px;background:var(--card);color:var(--ink);border:1px solid var(--acc);padding:5px 12px;margin:3px;cursor:pointer}
button:hover{background:var(--acc);color:var(--bg)}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--gold)}
canvas{max-width:100%;border:1px solid var(--line)}input[type=range]{width:100%;max-width:360px}
.row{display:flex;gap:8px}.cell{width:90px;height:90px;border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:28px}

.g4{display:grid;grid-template-columns:repeat(4,70px);gap:2px}.g4 div{height:62px;border:1px solid var(--line);font-size:12px;text-align:center;display:flex;flex-direction:column;justify-content:center}

.tr{background:var(--line);margin:4px 0}.bar{height:16px;background:var(--acc)}
.pn{display:flex;justify-content:space-between;font-family:system-ui,sans-serif}a{color:var(--acc);font-weight:600}
.tk{border:2px dashed var(--gold);padding:16px;margin:16px 0;background:var(--card)}
.lob{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}.lob a{display:block;border:1px solid var(--line);background:var(--card);padding:10px 12px;text-decoration:none;color:var(--ink);font-weight:400}
dt{font-weight:600;color:var(--acc)}dd{margin:0 0 6px}small{font-size:12px}
</style></head><body>
<header><div class="brand">Museum of <i>Minds</i></div><nav id="nav"></nav></header><main id="main"></main>
<script>
const $=(s,e=document)=>e.querySelector(s),h=(e,x)=>{e.innerHTML=x},M=$('#main');
let S={};try{S=JSON.parse(localStorage.getItem('mom')||'{}')}catch(e){}
const sv=()=>{try{localStorage.setItem('mom',JSON.stringify(S))}catch(e){}};
const R=[
{t:'Introduction to AI: agents and environments',w:'Week 1',s:'An agent senses its environment and acts to reach a goal; PEAS describes the task.',
b:'<p>An <b>agent</b> perceives its <b>environment</b> through sensors and acts through actuators. A <b>rational agent</b> picks the action expected to maximise its performance measure, given what it has perceived so far. To formalise a problem we write its <b>PEAS</b>: Performance measure, Environment, Actuators, Sensors. Environments are described as observable or not, deterministic or stochastic, episodic or sequential, static or dynamic, discrete or continuous, single- or multi-agent. Agent designs grow from <b>simple reflex</b> to <b>model-based</b>, <b>goal-based</b>, <b>utility-based</b> and <b>learning</b> agents.</p>',
e:'Reflex vacuum agent',k:'A robot vacuum is a real agent: sensors detect dirt and bumps, wheels and brushes are actuators.',m:'<b>Myth:</b> an agent must be a robot. <b>Fact:</b> a spam filter or a chess program is an agent too.',
q:['Which agent type keeps an internal model of the world?',['Simple reflex','Model-based','Random'],1],
d(el){let s;const rs=()=>s={a:1,b:1,at:0,sc:0,log:'Press Step'};rs();const dr=()=>{h(el,`<div class=row><div class=cell>${s.at==0?'🤖':''}${s.a?'🟫':'✨'}<small>A</small></div><div class=cell>${s.at==1?'🤖':''}${s.b?'🟫':'✨'}<small>B</small></div></div><p>Rule fired: <b>${s.log}</b> · Score ${s.sc} (+10 per clean, −1 per move)</p><button id=st>Step</button><button id=rs>Reset</button><p>This agent only sees its own square. Once both are clean it keeps wandering and loses points: it has no memory or goal, which is why we need better agent types.</p>`);$('#st',el).onclick=()=>{const k=s.at?'b':'a';if(s[k]){s[k]=0;s.sc+=10;s.log='Dirty → Suck'}else{s.at=1-s.at;s.sc-=1;s.log='Clean → Move'}dr()};$('#rs',el).onclick=()=>{rs();dr()}};dr()}},
{t:'Uninformed search, A* search and heuristics',w:'Week 2',s:'Search algorithms look for a path from the start to the goal; heuristics make the search smarter.',
b:'<p>Search finds a sequence of actions from the start state to a goal state. A problem is defined by its states, actions, transition model, goal test and path cost. <b>Uninformed</b> algorithms know nothing about how close a state is to the goal. <b>BFS</b> expands the shallowest node first using a queue and finds the path with the fewest steps. <b>DFS</b> expands the deepest node first using a stack; it needs little memory but may return a long path. <b>Uniform-cost search (UCS)</b> expands the node with the lowest path cost g(n) and is optimal. <b>A*</b> expands the lowest f(n) = g(n) + h(n), where the <b>heuristic</b> h(n) estimates the remaining cost. If h is <b>admissible</b> (never overestimates the true cost), A* is optimal.</p><p><b>Worked example.</b> On the small map below, BFS and DFS reach G with cost 9, but the cheapest route costs 8. UCS and A* find it, and A* does so by expanding fewer nodes.</p>',
e:'Four algorithms on one small map',k:'Navigation apps use A*-style search to find routes: the heuristic is often the straight-line distance to the destination.',m:'<b>Myth:</b> BFS always finds the cheapest path. <b>Fact:</b> it finds the fewest steps, which is the cheapest path only when every step costs the same.',
d(el){const G={S:{A:1,B:4},A:{S:1,B:2,C:6},B:{S:4,A:2,G:5},C:{A:6,G:3},G:{B:5,C:3}},H={S:7,A:6,B:4,C:3,G:0};
h(el,`<p>Road lengths: S–A 1, S–B 4, A–B 2, A–C 6, B–G 5, C–G 3. Start S, goal G. Heuristic h: S 7, A 6, B 4, C 3, G 0.</p><select id=al><option value=bfs>BFS</option><option value=dfs>DFS</option><option value=ucs>UCS</option><option value=astar>A*</option></select><button id=go>Run</button><p id=out></p>`);
$('#go',el).onclick=()=>{const al=$('#al',el).value;let fr=[{n:'S',g:0,p:['S']}],cl=new Set,ord=[],res=null;while(fr.length){let i=0;if(al=='dfs')i=fr.length-1;else if(al!='bfs'){let b=1e9;fr.forEach((x,j)=>{const f=x.g+(al=='astar'?H[x.n]:0);if(f<b){b=f;i=j}})}const x=fr.splice(i,1)[0];if(cl.has(x.n))continue;cl.add(x.n);ord.push(x.n);if(x.n=='G'){res=x;break}for(const m in G[x.n])if(!cl.has(m))fr.push({n:m,g:x.g+G[x.n][m],p:[...x.p,m]})}
h($('#out',el),`Order of expansion: <b>${ord.join(' → ')}</b><br>Path found: <b>${res.p.join(' → ')}</b>, cost <b>${res.g}</b>${res.g>8?' (not optimal, the best cost is 8)':' (optimal)'}`)}}},
{t:'Local search and constraint satisfaction',w:'Week 3',s:'When the path does not matter, we improve one solution step by step or satisfy constraints.',
b:'<p>In <b>local search</b> the path does not matter, only the final state. The algorithm keeps one current state and moves to a neighbour. <b>Hill climbing</b> always moves to the best neighbour, but it can stop at a <b>local maximum</b> or on a plateau. <b>Random restart</b> runs it from many starting points. <b>Simulated annealing</b> sometimes accepts a worse move with probability e<sup>−Δ/T</sup>, where Δ is how much worse the move is and the temperature T slowly decreases. A <b>constraint satisfaction problem (CSP)</b> has <b>variables</b>, <b>domains</b> (allowed values) and <b>constraints</b>. Example: colour the regions of Australia (WA, NT, SA, Q, NSW, V, T) with 3 colours so that neighbouring regions differ. <b>Backtracking</b> assigns one variable at a time and goes back when a constraint is broken; <b>forward checking</b> removes values that can no longer work.</p>',
e:'Hill climbing and annealing',k:'Timetables, exam schedules and Sudoku are CSPs; airlines use local search to improve crew schedules.',m:'<b>Myth:</b> hill climbing always finds the best answer. <b>Fact:</b> it is fast but can get stuck, so restarts or annealing are used.',
d(el){const V=[3,5,8,6,2,4,9,7,1];h(el,`<p><b>1. Hill climbing.</b> Heights at positions 0 to 8 are 3, 5, 8, 6, 2, 4, 9, 7, 1. Choose a start; the climber moves to the higher neighbour until none is higher.</p><select id=st>${V.map((v,i)=>`<option value=${i}>start at position ${i} (height ${v})</option>`).join('')}</select><button id=cl>Climb</button><p id=o1></p><p><b>2. Simulated annealing.</b> The chance of accepting a move that is Δ worse at temperature T is e<sup>−Δ/T</sup>.</p>Δ (how much worse): <b id=a1></b><br><input id=dl type=range min=1 max=10 value=3><br>T (temperature): <b id=a2></b><br><input id=tt type=range min=1 max=20 value=5><p id=o2></p>`);
$('#cl',el).onclick=()=>{let i=+$('#st',el).value,p=[i];for(;;){let b=i;[i-1,i+1].forEach(j=>{if(j>=0&&j<9&&V[j]>V[b])b=j});if(b==i)break;i=b;p.push(i)}h($('#o1',el),`Path: positions ${p.join(' → ')}. Stopped at height <b>${V[i]}</b>. ${V[i]==9?'This is the global maximum.':'This is only a <b>local maximum</b>; the best height is 9 at position 6.'}`)};
const u=()=>{const d=+$('#dl',el).value,t=+$('#tt',el).value;$('#a1',el).textContent=d;$('#a2',el).textContent=t;h($('#o2',el),`Probability of accepting = e<sup>−${d}/${t}</sup> = <b>${(Math.exp(-d/t)*100).toFixed(1)}%</b>. When T is large, bad moves are often accepted; as T cools, the search behaves like hill climbing.`)};el.querySelectorAll('input').forEach(i=>i.oninput=u);u()}},
{t:'Adversarial search and game trees',w:'Week 4',s:'In games we must plan against an opponent who is also trying to win.',
b:'<p>In a two-player zero-sum game one player’s gain is the other’s loss. <b>Minimax</b> builds the game tree: MAX nodes take the largest child value, MIN nodes take the smallest, so MAX gets the best result against a perfect opponent. The tree grows exponentially, so <b>alpha-beta pruning</b> skips branches that cannot change the decision: α is the best value MAX can already guarantee, β the best for MIN. It returns exactly the same value as minimax, with fewer nodes. When chance is involved (dice), <b>expectimax</b> replaces MIN nodes with chance nodes that take the probability-weighted average.</p><p><b>Worked example.</b> The tree below has a MAX root and three MIN nodes. Switch pruning on and see which leaves are skipped.</p>',
e:'Minimax and alpha-beta on one small tree',k:'Deep Blue beat the chess champion Garry Kasparov in 1997 using search with pruning.',m:'<b>Myth:</b> pruning makes the AI weaker. <b>Fact:</b> the answer is identical; only the work is smaller.',
d(el){const T=[[3,12,8],[2,4,6],[14,5,2]];let on=false;const dr=()=>{let a=-1e9,n=0;const rows=T.map((L,c)=>{let v=1e9,pr=false;const cs=L.map((x,i)=>{if(pr)return`<s style="opacity:.4">${x}</s>`;n++;v=Math.min(v,x);if(on&&v<=a&&i<L.length-1)pr=true;return`<b>${x}</b>`}).join(' &nbsp; ');a=Math.max(a,v);return`<p>MIN node ${c+1}, leaves ${cs} → value ${pr?'at most ':''}<b>${v}</b></p>`}).join('');
h(el,`<p>The MAX root picks the largest of the three MIN values. Each MIN node picks the smallest of its leaves.</p>${rows}<p>Root value: <b>${a}</b>. Leaves evaluated: <b>${n}</b> of 9.</p><button id=t>${on?'Switch alpha-beta off':'Switch alpha-beta on'}</button>`);$('#t',el).onclick=()=>{on=!on;dr()}};dr()}},
{t:'Markov decision processes and reinforcement learning',w:'Week 5',s:'An agent learns the best actions by trying them and collecting rewards.',
b:'<p>A <b>Markov decision process (MDP)</b> has states S, actions A, transition probabilities T(s,a,s′), rewards R and a discount factor γ. The “Markov” part means the next state depends only on the current state and action. Example: a delivery robot has states Charged and Low; the action Work earns reward but may drain the battery, the action Recharge earns nothing but returns to Charged. A <b>policy</b> π says which action to take in each state. <b>Value iteration</b> computes the best values with the Bellman update V(s) = max<sub>a</sub> Σ T(s,a,s′)[R + γV(s′)]. In <b>reinforcement learning (RL)</b> the agent does not know T or R and learns from reward. <b>Q-learning</b> updates Q(s,a) ← Q + α[r + γ max Q(s′,a′) − Q] and balances <b>exploration</b> (trying new actions) with <b>exploitation</b> (using the best known one), for example ε-greedy.</p>',
e:'Two slot machines',k:'RL helped AlphaGo beat Go champion Lee Sedol in 2016 and trains robots to walk.',m:'<b>Myth:</b> RL needs labelled examples. <b>Fact:</b> it learns only from rewards.',
d(el){let Q,N,tot;const P=[.3,.7],rs=()=>{Q=[0,0];N=[0,0];tot=0},pull=a=>{const r=Math.random()<P[a]?1:0;N[a]++;Q[a]+=(r-Q[a])/N[a];tot+=r};rs();
const dr=()=>{h(el,`<p>Two slot machines with hidden win chances (A 30%, B 70%). The agent keeps an estimate Q for each and updates it after every pull: Q ← Q + α(reward − Q) with α = 1/pulls.</p><button id=a>Pull A</button><button id=b>Pull B</button><button id=au>100 pulls with ε = 0.1</button><button id=rs>Reset</button><table><tr><td>Machine A &nbsp;</td><td>pulls ${N[0]} &nbsp;</td><td>Q = <b>${Q[0].toFixed(2)}</b></td></tr><tr><td>Machine B &nbsp;</td><td>pulls ${N[1]} &nbsp;</td><td>Q = <b>${Q[1].toFixed(2)}</b></td></tr></table><p>Total reward: <b>${tot}</b></p><p>ε-greedy: with probability 0.1 the agent tries a random machine (explore); otherwise it pulls the machine with the higher Q (exploit).</p>`);
$('#a',el).onclick=()=>{pull(0);dr()};$('#b',el).onclick=()=>{pull(1);dr()};$('#rs',el).onclick=()=>{rs();dr()};$('#au',el).onclick=()=>{for(let i=0;i<100;i++)pull(Math.random()<.1||Q[0]==Q[1]?Math.floor(Math.random()*2):Q[0]>Q[1]?0:1);dr()}};dr()}},
{t:'Probability and Bayesian networks',w:'Week 6',s:'Probability measures uncertainty, and Bayes’ rule updates beliefs when evidence arrives.',
b:'<p><b>Conditional probability</b> P(A|B) is the chance of A once B is known. <b>Bayes’ rule</b> reverses it: P(H|E) = P(E|H)·P(H) / P(E), where P(H) is the <b>prior</b> and P(H|E) the <b>posterior</b>. A <b>Bayesian network</b> is a directed acyclic graph where each node stores a conditional probability table, so the joint distribution factorises into small pieces. <b>Inference</b> asks questions such as “given these symptoms, how likely is the disease?”.</p>',
e:'Medical test calculator',k:'Doctors often overestimate disease risk after a positive test because they ignore the base rate.',m:'<b>Myth:</b> a 90% accurate test means 90% chance you are sick. <b>Fact:</b> it depends on how rare the disease is.',
q:['The disease is rare and the test is imperfect. A positive result usually means…',['You are almost surely sick','You are probably still healthy','Exactly 90% sick'],1],
d(el){h(el,`<p>Prevalence <b id=a1></b><br><input id=p1 type=range min=0.1 max=50 step=0.1 value=1></p><p>Sensitivity P(positive | sick) <b id=a2></b><br><input id=p2 type=range min=50 max=100 value=90></p><p>False-positive rate P(positive | healthy) <b id=a3></b><br><input id=p3 type=range min=0 max=30 value=9></p><p id=ou></p>`);
const u=()=>{const p=+$('#p1',el).value/100,s=+$('#p2',el).value/100,f=+$('#p3',el).value/100,tp=p*s,fp=(1-p)*f;$('#a1',el).textContent=(p*100).toFixed(1)+'%';$('#a2',el).textContent=(s*100)+'%';$('#a3',el).textContent=(f*100)+'%';h($('#ou',el),`Out of 10,000 people: <b>${Math.round(tp*1e4)}</b> sick and positive, <b>${Math.round(fp*1e4)}</b> healthy and positive.<br>P(sick | positive) = <b>${(tp+fp?tp/(tp+fp)*100:0).toFixed(1)}%</b>`)};el.querySelectorAll('input').forEach(i=>i.oninput=u);u()}},
{t:'Hidden Markov models and sequential inference',w:'Week 7',s:'When the true state is hidden, we estimate it by combining a probabilistic model with noisy sensor readings over time.',
b:'<p><b>Why hidden states?</b> A sensor gives a measurement, not the full truth. A HIGH temperature does not prove a machine is faulty: sensors give false alarms, a fault can exist before an alarm, and past readings help interpret a new one. So we use probabilities.</p><p><b>Markov chain.</b> It describes how a system moves between states over time. The <b>Markov assumption</b> says the next state depends only on the current state: P(X<sub>t+1</sub> | X<sub>t</sub>, X<sub>t−1</sub>, …) = P(X<sub>t+1</sub> | X<sub>t</sub>). The <b>transition matrix</b> T lists these probabilities; each row adds to 1. Our machine example: Healthy → Healthy 0.90, Healthy → Faulty 0.10, Faulty → Healthy 0.20, Faulty → Faulty 0.80. One-step prediction is p<sub>t+1</sub> = p<sub>t</sub> × T. From [0.80, 0.20] we get Healthy 0.80×0.90 + 0.20×0.20 = 0.76 and Faulty 0.24.</p><p><b>Hidden Markov model (HMM).</b> The state X is hidden but produces observations E. It has three ingredients: initial probabilities π (80% Healthy, 20% Faulty), transition probabilities T, and <b>emission probabilities</b> O: P(Normal | Healthy) = 0.80, P(High | Healthy) = 0.20, P(Normal | Faulty) = 0.30, P(High | Faulty) = 0.70. Note P(High | Faulty) is not P(Faulty | High); to reverse it we use Bayes’ rule.</p><p><b>Filtering</b> estimates the <i>current</i> state from the readings so far: predict with T, observe, correct by multiplying by the emission probability, normalise. First HIGH reading: Healthy 0.80×0.20 = 0.16, Faulty 0.20×0.70 = 0.14, total 0.30, so Faulty rises from 20% to 46.7%. A second HIGH: predict Healthy 0.573, Faulty 0.427; correct to [0.115, 0.299]; normalise to Faulty ≈ 72.3%.</p><p><b>Smoothing</b> re-estimates a <i>past</i> state using later evidence (forward × backward messages): after HIGH, HIGH, the estimate that the machine was Faulty at time 1 rises from 46.7% to 67.7%. <b>Viterbi</b> finds the single best complete path by taking the MAX instead of the SUM; for HIGH, HIGH the best path is Faulty, Faulty (score 0.0784). Filtering gives probabilities of the current state; Viterbi gives one best sequence.</p><p><b>Uses and limits.</b> Machine monitoring, robot localisation (noisy distance measurements) and speech recognition. The probabilities must be supplied or learned from data, and the model must represent the system well enough.</p>',
e:'Machine-health HMM',k:'Robots use the same idea to estimate their position from noisy distance measurements.',m:'<b>Myth:</b> one HIGH reading proves a fault. <b>Fact:</b> it raises the probability from 20% to 46.7%; more evidence is needed.',
d(el){const PI=[.8,.2],T=[[.9,.1],[.2,.8]],E=[[.8,.2],[.3,.7]];let ob=[1,1];const nz=v=>{const q=v[0]+v[1];return[v[0]/q,v[1]/q]},pc=x=>(x*100).toFixed(1)+'%';
const run=()=>{const n=ob.length,f=[],b=[];ob.forEach((o,t)=>{const pr=t?[0,1].map(j=>f[t-1][0]*T[0][j]+f[t-1][1]*T[1][j]):PI;f.push(nz([0,1].map(j=>pr[j]*E[j][o])))});
b[n-1]=[1,1];for(let t=n-2;t>=0;t--)b[t]=[0,1].map(i=>T[i][0]*E[0][ob[t+1]]*b[t+1][0]+T[i][1]*E[1][ob[t+1]]*b[t+1][1]);
const sm=f.map((x,t)=>nz([x[0]*b[t][0],x[1]*b[t][1]])),d=[[PI[0]*E[0][ob[0]],PI[1]*E[1][ob[0]]]],bp=[];
for(let t=1;t<n;t++){const row=[],bk=[];for(let j=0;j<2;j++){const c=[d[t-1][0]*T[0][j],d[t-1][1]*T[1][j]],i=c[0]>=c[1]?0:1;row.push(E[j][ob[t]]*c[i]);bk.push(i)}d.push(row);bp.push(bk)}
let q=d[n-1][0]>=d[n-1][1]?0:1;const path=[q];for(let t=n-1;t>=1;t--){q=bp[t-1][q];path.unshift(q)}
return{f,sm,path,nx:[0,1].map(j=>f[n-1][0]*T[0][j]+f[n-1][1]*T[1][j])}};

{t:'Rational decisions and classical machine learning',w:'Week 8',s:'A rational agent weighs probability against the cost of mistakes, and machine learning learns the needed probabilities and rules from data.',
b:'<p><b>Rational decisions.</b> Probability alone does not say what to do: an 80% spam prediction does not mean we should delete. A <b>rational agent</b> considers probability and consequences. With losses Delete = 0 (spam) / 100 (legitimate) and Deliver = 5 / 0, and P(Spam) = 0.8: EL(Delete) = 0.8×0 + 0.2×100 = 20 and EL(Deliver) = 0.8×5 + 0.2×0 = 4, so delivering is better. Adding a third action, Flag for review (loss 2 either way), gives EL = 2, the best. <b>Utility</b> U(outcome) turns preferences into numbers, and the principle of <b>maximum expected utility</b> is a* = argmax<sub>a</sub> Σ P(s | e) U(a, s). It rests on rational-preference axioms (completeness, transitivity, continuity, independence). A rational agent can still fail, because uncertainty means a good decision can have a bad outcome. Utility can differ between people: with U = √money, a sure 40 (6.32) beats a 50% chance of 100 (5).</p><p><b>Learning.</b> <b>Supervised</b> learning uses labelled examples (features x and known target y), <b>unsupervised</b> finds patterns without labels, and <b>reinforcement</b> learning learns from rewards. A learned model replaces hand-written rules, such as “if prize appears, it is spam”, which can fail. <b>Maximum likelihood</b> picks the parameter that makes the data most likely: for H, H, H, T the best estimate of P(Heads) is 3/4.</p><p><b>Naive Bayes</b> picks the class with the highest score P(class) × Π P(feature | class), assuming features are independent given the class (that is why it is “naive”). Training set: 4 spam, 6 legitimate; “prize” in 3 spam and 1 legitimate; suspicious link in 3 spam and 2 legitimate. For a message with both clues: Spam score = (4/10)(3/4)(3/4) = 0.225, Legitimate = (6/10)(1/6)(2/6) = 0.033, so Spam wins. <b>Laplace smoothing</b> avoids zero probabilities, e.g. (0 + 1)/(6 + 2) = 1/8.</p><p><b>Linear models.</b> Linear regression predicts a number: for courier time ŷ = 3x + 5, so 5 km gives 20 minutes; <b>mean squared error</b> MSE = (1/n)Σ(y − ŷ)² measures how wrong the line is (0.5 min² in the lecture example). Logistic regression turns a score into a probability with the sigmoid 1/(1 + e<sup>−z</sup>) (0.5 at z = 0). <b>Decision trees</b> split by conditions, <b>random forests</b> vote over many trees, and <b>K-Means</b> groups unlabelled data by distance (feature scaling matters).</p><p><b>Evaluation.</b> Keep training, validation and test data separate. <b>Overfitting</b> means low training error but poor generalisation. <b>Accuracy can mislead</b>: always predicting Legitimate on 990 legitimate and 10 spam messages gives 99% accuracy and 0% spam recall. With TP = 8, FP = 12, FN = 2, TN = 978: accuracy 98.6%, precision 40%, recall 80%, F1 ≈ 53.3%. Watch for <b>data leakage</b>, <b>distribution shift</b> and <b>calibration</b> (does 80% mean about 80 in 100?).</p>',
e:'Expected loss and metrics',k:'The best action depends on the costs: a university may lose more from deleting a real message than a company does.',m:'<b>Myth:</b> 99% accuracy means a great model. <b>Fact:</b> with rare spam it can mean the model finds no spam at all.',
d(el){h(el,`<p><b>1. Expected loss.</b> P(spam) = <b id=pv></b><br><input id=p type=range min=0 max=100 value=80></p><div id=tb></div><hr><p><b>2. Confusion matrix metrics</b> (spam = positive class)</p>TP <input id=tp type=number min=0 value=8 style="width:70px"> FP <input id=fp type=number min=0 value=12 style="width:70px"> FN <input id=fn type=number min=0 value=2 style="width:70px"> TN <input id=tn type=number min=0 value=978 style="width:80px"><div id=mt></div>`);
const u=()=>{const p=+$('#p',el).value/100,L=[['Delete',100*(1-p)],['Deliver',5*p],['Flag for review',2]],m=Math.min(...L.map(x=>x[1]));$('#pv',el).textContent=Math.round(p*100)+'%';h($('#tb',el),L.map(x=>`${x[0]}: expected loss <b>${x[1].toFixed(1)}</b>${x[1]==m?' ← lowest, best action':''}`).join('<br>')+'<br>Losses: Delete costs 100 if legitimate; Deliver costs 5 if spam; Review costs 2 either way.');
const v=i=>+$('#'+i,el).value,tp=v('tp'),fp=v('fp'),fn=v('fn'),tn=v('tn'),n=tp+fp+fn+tn,pr=tp+fp?tp/(tp+fp):0,rc=tp+fn?tp/(tp+fn):0,f1=pr+rc?2*pr*rc/(pr+rc):0;h($('#mt',el),`Accuracy <b>${n?((tp+tn)/n*100).toFixed(1):0}%</b> · Precision <b>${(pr*100).toFixed(1)}%</b> · Recall <b>${(rc*100).toFixed(1)}%</b> · F1 <b>${(f1*100).toFixed(1)}%</b>`)};el.querySelectorAll('input').forEach(i=>i.oninput=u);u()}},
{t:'Perceptrons and neural networks',w:'Week 9',s:'A perceptron makes a simple weighted decision; networks of neurons learn complex patterns by adjusting weights to reduce errors.',
b:'<p><b>Perceptron.</b> An artificial neuron receives numbers, multiplies each by a <b>weight</b>, adds a <b>bias</b> and applies an <b>activation function</b>: z = w<sub>1</sub>x<sub>1</sub> + w<sub>2</sub>x<sub>2</sub> + b. With the step activation the output is 1 if z ≥ 0 and 0 if z < 0. It is inspired by biology but is a simplified mathematical model.</p><p><b>Worked example (mobile robot).</b> Is the surface safe: STABLE (1) or UNSTABLE (0)? Inputs: surface grip 0.8 with weight +2, slip 0.2 with weight −3, bias −0.5. z = 2(0.8) − 3(0.2) − 0.5 = +0.5, so STABLE. If slip rises to 0.8: z = 1.6 − 2.4 − 0.5 = −1.3, so UNSTABLE.</p><p><b>Learning from an error.</b> Predict, compare with the true label, update: w<sup>new</sup> = w<sup>old</sup> + η(y − ŷ)x with learning rate η = 0.1. If the true label for grip 0.8, slip 0.8 is STABLE, the error is 1 − 0 = +1, so grip weight 2 → 2.08, slip weight −3 → −2.92, bias −0.5 → −0.4.</p><p><b>Why one neuron is not enough.</b> One neuron gives a linear boundary, so it only works when classes are linearly separable. XOR (output 1 when exactly one input is 1) cannot be separated by one straight line. Hidden layers let networks learn more complex boundaries.</p><p><b>Neural network.</b> Layers of neurons: input layer (features), hidden layers (intermediate patterns), output layer (prediction). Information flows forward (<b>forward propagation</b>). <b>Activation functions</b> add nonlinearity: step (0 or 1), sigmoid 1/(1 + e<sup>−z</sup>) (smooth, between 0 and 1) and ReLU max(0, z).</p><p><b>How a network learns.</b> (1) forward pass: predict; (2) calculate the loss, e.g. L = (ŷ − y)²; (3) <b>backpropagation</b>: compute how the error changes each weight; (4) update by <b>gradient descent</b>: w ← w − α ∂L/∂w, where the learning rate α sets the step size; (5) repeat over many <b>epochs</b> (one epoch = one pass through the training set).</p><p><b>Evaluation.</b> Train to learn weights, validate to choose settings, test on unseen data; the same example must not be in both training and test sets. Model A with 98% training and 65% test accuracy is <b>overfitting</b>; Model B with 91% and 89% <b>generalises</b>. If validation loss rises while training loss falls, that signals overfitting. Mistakes have different costs: predicting STABLE when the surface is UNSTABLE is dangerous. Look at the errors, not only the accuracy. High accuracy does not prove understanding. CNNs extend networks to images by learning visual features automatically.</p><p><b>In Python</b> (scikit-learn): create <code>MLPClassifier(hidden_layer_sizes=(3,))</code>, <code>fit</code> on training data, <code>predict</code> on test data, then evaluate accuracy.</p>',
e:'Robot perceptron and activation functions',k:'Face unlock, spam filters, robot obstacle avoidance and medical image analysis all use neural networks.',m:'<b>Myth:</b> if a network recognises 100 cats it understands what a cat is. <b>Fact:</b> correct predictions do not always mean deep understanding.',
d(el){const W0=[2,-3],B0=-.5;let w=W0.slice(),b=B0;h(el,`<p><b>1. Robot perceptron.</b> Surface grip x₁: <b id=gv></b><br><input id=g type=range min=0 max=1 step=0.1 value=0.8></p><p>Slip x₂: <b id=sv></b><br><input id=s type=range min=0 max=1 step=0.1 value=0.2></p><p>True label: <select id=y><option value=1>STABLE (1)</option><option value=0>UNSTABLE (0)</option></select> <button id=rs>Reset weights</button></p><div id=o></div><hr><p><b>2. Activation functions.</b> Input z: <b id=zv></b><br><input id=z type=range min=-4 max=4 step=0.1 value=-1></p><div id=o2></div>`);
const f=x=>x.toFixed(2),upd=()=>{const g=+$('#g',el).value,s=+$('#s',el).value,y=+$('#y',el).value,z=w[0]*g+w[1]*s+b,o=z>=0?1:0,e=y-o;$('#gv',el).textContent=g.toFixed(1);$('#sv',el).textContent=s.toFixed(1);
h($('#o',el),`Weights: grip ${f(w[0])}, slip ${f(w[1])}, bias ${f(b)}<br>z = ${f(w[0])}×${g.toFixed(1)} + (${f(w[1])})×${s.toFixed(1)} + (${f(b)}) = <b>${f(z)}</b> → output <b>${o}</b> (${o?'STABLE':'UNSTABLE'})<br>${e?`Wrong! error = ${e>0?'+':''}${e}. Update with η = 0.1: w ← w + η × error × x.<br><button id=up>Apply update</button>`:'Correct, no update needed.'}`);
if(e)$('#up',el).onclick=()=>{w[0]+=.1*e*g;w[1]+=.1*e*s;b+=.1*e;upd()}};
const u2=()=>{const z=+$('#z',el).value;$('#zv',el).textContent=z.toFixed(1);h($('#o2',el),`Step: <b>${z>=0?1:0}</b> · Sigmoid: <b>${f(1/(1+Math.exp(-z)))}</b> · ReLU: <b>${f(Math.max(0,z))}</b>`)};
$('#rs',el).onclick=()=>{w=W0.slice();b=B0;upd()};['g','s','y'].forEach(i=>$('#'+i,el).oninput=upd);$('#z',el).oninput=u2;upd();u2()}},
{t:'LLMs, generative AI and AI safety',w:'Week 10',s:'Large language models predict the next token; their power comes with risks that need safety work.',
b:'<p>A <b>large language model (LLM)</b> is a neural network, usually a <b>transformer</b> using attention, trained to predict the next <b>token</b> of text. It turns scores into probabilities with softmax; <b>temperature</b> controls randomness. After pre-training, models are fine-tuned with human feedback. <b>Generative AI</b> also includes image and audio models. LLMs can <b>hallucinate</b> fluent but false statements, inherit <b>bias</b> from data and be misused. <b>AI safety</b> work covers alignment, robustness, privacy, evaluation and human oversight, which matters most for Physical AI where errors affect the real world.</p>',
e:'Next-word sampler',k:'The transformer architecture was introduced in the 2017 paper “Attention Is All You Need”.',m:'<b>Myth:</b> an LLM looks up facts in a database. <b>Fact:</b> it generates likely text, so answers must be verified.',
q:['An LLM’s core training objective is…',['Predicting the next token','Searching the web','Maximising grid-world reward'],0],

];

function quiz(i){const[q,o,c]=R[i].q,el=$('#quiz');h(el,`<b>🎙 Curator’s question:</b> ${q}<div>${o.map((t,j)=>`<button data-j=${j}>${t}</button>`).join('')}</div><p id=fb>${S[i]?'🎫 Stamp collected.':''}</p>`);el.querySelectorAll('button').forEach(b=>b.onclick=()=>{if(+b.dataset.j==c){S[i]=1;sv();$('#fb').textContent='✅ Correct. Stamp collected.';nav()}else $('#fb').textContent='Not quite. Reread the placard and try again.'})}
function exitR(){const G=[['Agent','Something that senses and acts in an environment.'],['Heuristic','An estimate of remaining cost to the goal.'],['Admissible','A heuristic that never overestimates.'],['CSP','Variables, domains and constraints to satisfy.'],['Minimax','Best move assuming an optimal opponent.'],['MDP','Model of states, actions, rewards and chance.'],['Policy','A rule mapping each state to an action.'],['Bayes’ rule','Updates a prior belief with evidence.'],['HMM','Hidden states observed through noisy evidence.'],['Overfitting','Memorising training data instead of generalising.'],['Perceptron','A single threshold neuron.'],['Token','A chunk of text an LLM reads or predicts.']];
